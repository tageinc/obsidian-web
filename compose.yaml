services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    env_file: .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-obsidian}
      DB_USERNAME: ${DB_USERNAME:-obsidian}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      LOG_CHANNEL: stderr
      REDIS_WORKLOADS_ENABLED: ${REDIS_WORKLOADS_ENABLED:-false}
      REDIS_WORKLOADS_VERSIONS_ENABLED: ${REDIS_WORKLOADS_VERSIONS_ENABLED:-true}
      REDIS_WORKLOADS_METRICS_ENABLED: ${REDIS_WORKLOADS_METRICS_ENABLED:-true}
      REDIS_WORKLOADS_HOST: ${REDIS_WORKLOADS_HOST:-redis}
      REDIS_WORKLOADS_PORT: ${REDIS_WORKLOADS_PORT:-6379}
      REDIS_WORKLOADS_DB: ${REDIS_WORKLOADS_DB:-2}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-obsidian}
      MYSQL_USER: ${DB_USERNAME:-obsidian}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    profiles: ["redis"]
    image: redis:8.2.5-alpine@sha256:82db05459fb850cc3fe2bfa510a054323247bbd0ecb8831272e41fe14b9ead82
    # Disposable local/test data only. No published port or persistent volume.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  app-storage:
  db-data:
