name: Application checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.8.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, gd, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - name: Install locked backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install isolated browser runtime
        run: npx playwright install --with-deps chromium
      - name: Canonical application verification
        run: php scripts/check-all.php application
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  redis-workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.5-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: array
      LOG_CHANNEL: 'null'
      REDIS_WORKLOADS_INTEGRATION: '1'
      REDIS_WORKLOADS_HOST: 127.0.0.1
      REDIS_WORKLOADS_PORT: '6379'
      REDIS_WORKLOADS_DB: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, gd, mbstring, pdo_sqlite, zip, redis-6.3.0
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Isolated cache TTL, concurrency, invalidation and outage recovery
        run: php scripts/check-all.php redis
