# Optional local mail capture. Merge after compose.yaml; never used by deploy.sh.
services:
  app:
    environment:
      APP_ENV: local
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: "1025"
    depends_on:
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
